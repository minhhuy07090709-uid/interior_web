<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Interior Design{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="nav-container">
        <div class="logo">Interior Design Co.</div>

        <form class="search-form" action="{{ url_for('search') }}" method="GET">
          <input
            type="text"
            name="q"
            placeholder="Tìm sản phẩm..."
            value="{{ request.args.get('q', '') }}"
          />
          <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>

        <button class="hamburger" onclick="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <!-- Overlay làm mờ nền khi menu mở -->
      <div id="overlay" onclick="toggleMenu()"></div>

      <!-- Drawer trượt từ phải -->
      <nav id="nav-menu">
        <button class="close-btn" onclick="toggleMenu()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/services">Services</a>
        <a href="/gallery">Gallery</a>
        <a href="/projects">Projects</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>

    <script>
      function toggleMenu() {
        document.getElementById("nav-menu").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
      }
    </script>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>&copy; 2026 Interior Design Co.</p>
    </footer>

    <!-- Floating contact buttons -->
    <div class="floating-contact">
      <a
        href="https://www.facebook.com/thietkenoithat1A"
        target="_blank"
        class="float-btn facebook"
      >
        <i class="fa-brands fa-facebook-f"></i>
        <span class="tooltip">Xem Facebook</span>
      </a>
      <a
        href="https://zalo.me/0903686705"
        target="_blank"
        class="float-btn zalo"
      >
        <img
          src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/zalo.svg"
          alt="Zalo"
          class="zalo-icon"
        />
        <span class="tooltip">Chat Zalo</span>
      </a>
      <a href="tel:0903686705" class="float-btn phone">
        <i class="fa-solid fa-phone"></i>
        <span class="tooltip">Gọi ngay</span>
      </a>
    </div>
  </body>
</html>
