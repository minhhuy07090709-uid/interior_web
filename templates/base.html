<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Interior Design{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/services">Services</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact">Contact</a>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>&copy; 2026 Interior Design Co.</p>
    </footer>

    <!-- Floating contact buttons -->
    <div class="floating-contact">
      <a
        href="https://www.facebook.com/thietkenoithat1A"
        target="_blank"
        class="float-btn facebook"
      >
        <i class="fa-brands fa-facebook-f"></i>
        <span class="tooltip">Xem Facebook</span>
      </a>
      <a
        href="https://zalo.me/0903686705"
        target="_blank"
        class="float-btn zalo"
      >
        <img
          src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/zalo.svg"
          alt="Zalo"
          class="zalo-icon"
        />
        <span class="tooltip">Chat Zalo</span>
      </a>
      <a href="tel:0903686705" class="float-btn phone">
        <i class="fa-solid fa-phone"></i>
        <span class="tooltip">Gọi ngay</span>
      </a>
    </div>
  </body>
</html>
